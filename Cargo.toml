[workspace]
members = ["crates/reinfors-core", "crates/reinfors-py"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# reinfors: general-purpose gym-style simulation + batching engine.
#   crates/reinfors-core  — pure Rust engine (no Python); the value, testable on its own.
#   crates/reinfors-py    — PyO3 bindings, compiled into the `reinfors._reinfors` module.
# The ergonomic Python API (the declarative game builder) lives in python/reinfors/ as it grows.
