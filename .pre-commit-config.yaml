# Hooks default to commit-time; the push guard below opts into the pre-push stage explicitly, so a
# `git push` runs only the guard (not the full ruff/cargo suite).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # README media in assets/ is exempt (bounded, deliberate; see assets/ history)
        exclude: ^assets/


  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: no-direct-push-to-main
        name: block direct pushes to main
        entry: scripts/block-main-push.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
