[package]
name = "reinfors-games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["car-racing"]
car-racing = ["dep:rapier2d", "dep:libm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
cozy-chess = "0.3.4"
reinfors-core = { path = "../reinfors-core" }
rs_poker = { version = "5", default-features = false }
rapier2d = { version = "=0.35.2", features = ["serde-serialize", "enhanced-determinism"], optional = true }
libm = { version = "0.2", optional = true }

[dev-dependencies]
rayon = "1"
