[package]
name = "reinfors-games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["car-racing"]
car-racing = ["dep:rapier2d", "dep:libm", "dep:smallvec", "dep:tiny-skia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
cozy-chess = "0.3.4"
reinfors-core = { path = "../reinfors-core" }
rs_poker = { version = "5", default-features = false }
rapier2d = { version = "=0.35.2", features = ["enhanced-determinism"], optional = true }
libm = { version = "0.2", optional = true }
smallvec = { version = "1", optional = true }
tiny-skia = { version = "0.11", optional = true }

[dev-dependencies]
rayon = "1"
serde_json = "1"
# PNG load/save is cfg(test) fixture/debug tooling only; feature unification gives
# tests png-format without production builds compiling png/flate2.
tiny-skia = { version = "0.11", features = ["png-format"] }
