# Rust-native standard nets on candle (pure Rust — no libtorch, no external C++ library). The CPU build
# is fully self-contained, so this is a normal workspace member and ships inside the wheel with no system
# deps. `metal` / `cuda` are opt-in GPU backends (Metal is self-contained on macOS; CUDA needs the CUDA
# runtime, like any GPU framework — a separate build, never the default).
[package]
name = "reinfors-nn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"

[features]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Optional CPU BLAS backends: candle's default gemm trails libtorch's MKL for large matmuls. `accelerate`
# uses Apple's Accelerate (self-contained on macOS); `mkl` uses Intel MKL. Both recover most of the gap.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
