name: verify-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "published version to verify (PEP 440, e.g. 0.1.0rc1)"
        type: string
        required: true
      index:
        description: "index to install from"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: clean install from the index
        shell: bash
        run: |
          python -m pip install numpy
          if [ "${{ inputs.index }}" = "testpypi" ]; then
            python -m pip install --index-url https://test.pypi.org/simple --no-deps --only-binary=:all: "reinfors==${{ inputs.version }}"
          else
            python -m pip install --no-deps --only-binary=:all: "reinfors==${{ inputs.version }}"
          fi
      - name: import and build_info assertions
        shell: bash
        run: |
          python - <<'PYEOF'
          import importlib.metadata
          import reinfors as rf

          version = "${{ inputs.version }}"
          assert importlib.metadata.version("reinfors") == version
          info = rf.build_info()
          assert info["profile"] == "release", info
          assert info["git_dirty"] is False, info
          # rc versions are dispatched from an untagged branch; finals build from the release tag
          expected_tag = None if "rc" in version else "v" + version
          assert info["git_tag"] == expected_tag, info
          print("ok:", info)
          PYEOF
      - name: quickstart example
        shell: bash
        run: python examples/quickstart.py
