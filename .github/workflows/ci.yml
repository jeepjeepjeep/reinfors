name: ci

# One run per change: PRs (any base, so stacked PRs are covered) build via pull_request;
# direct pushes build only on main, the post-merge run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Generated catalogue is current
        run: python scripts/generate_docs.py --check

      - name: Check local documentation links
        run: python scripts/check_docs.py

      - name: Build documentation
        run: uvx --with mkdocs-material==9.7.7 mkdocs==1.6.1 build --strict

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python  # pyo3 build scripts need an interpreter to configure against
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test  # both pure-Rust crates; the binding crate is exercised from Python, not cargo test
        run: cargo test -p reinfors-core -p reinfors-games

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5  # puts python3.12 on PATH for maturin --interpreter
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable  # maturin compiles the extension

      - uses: Swatinem/rust-cache@v2

      - name: Install uv  # used only as a pinned tool runner — no project/lock management
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      # Tool versions are pinned here (and kept identical to .pre-commit-config.yaml) so CI is
      # reproducible without a lockfile.
      - name: Ruff check
        run: uvx ruff@0.15.15 check .

      - name: Ruff format check
        run: uvx ruff@0.15.15 format --check .

      - name: Mypy  # numpy ships types; torch (optional) is treated as Any via pyproject overrides
        run: uvx --with numpy mypy@2.1.0 python

      - name: Build extension
        run: uvx maturin@1.14.0 build --out dist --interpreter python3.12

      - name: Tests
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --no-project --python 3.12 --with "$wheel" --with pytest==9.1.0 pytest
