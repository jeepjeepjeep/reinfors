# Build release wheels for every platform and publish to PyPI.
#
# One-time setup (PyPI side): create the `reinfors` project's Trusted Publisher at
# https://pypi.org/manage/account/publishing/ — GitHub owner `jeepjeepjeep`, repo `reinfors`,
# workflow `release.yml`, and leave the "environment" field BLANK (this workflow uses none). No API
# token/secret is needed; publishing is via OIDC.
#
# To cut a release: bump `[workspace.package] version` in Cargo.toml (the single version source; maturin
# reads it), merge, then publish a GitHub Release tagged `vX.Y.Z`. That fires this workflow, which builds
# release (--release) abi3 wheels + an sdist and uploads them. Manual `workflow_dispatch` builds the
# wheels but does NOT publish (the publish job is gated on a release event) — use it to smoke the build.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 } # intel
          - { os: macos-14, target: aarch64 } # apple silicon
          - { os: windows-latest, target: x64 }
    steps:
      # Actions are pinned to full commit SHAs (version in the trailing comment) rather than mutable
      # tags/branches: this workflow holds `id-token: write` (PyPI publish rights via OIDC), so a
      # compromised tag could otherwise abuse that token. Bump the SHA + comment together to upgrade.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10" # the abi3 floor (requires-python >=3.10); one wheel serves 3.10+
      - uses: PyO3/maturin-action@fdd104694b233054d6e985e29b3af9f126af7ac6 # v1.9.0
        with:
          target: ${{ matrix.target }}
          # --release is essential: a debug build runs the Rust core ~10x slower (see core_build_profile).
          args: --release --out dist
          manylinux: auto # build inside a manylinux container on Linux for broad compatibility
          sccache: "true"
      # Install + import the freshly built wheel before it can reach PyPI (versions there are immutable —
      # a broken upload burns the version number). Runs on every native-arch runner; only the QEMU-cross
      # aarch64-linux wheel can't be executed by its host, so that row stays build-only (standard tradeoff).
      - name: smoke-import the built wheel
        if: matrix.os != 'ubuntu-latest' || matrix.target != 'aarch64'
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps --find-links dist reinfors
          python -c "import reinfors as rf; rf.Env(rf.games.Connect4()).reset()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: PyO3/maturin-action@fdd104694b233054d6e985e29b3af9f126af7ac6 # v1.9.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
