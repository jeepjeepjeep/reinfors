# Build release wheels for every platform and publish to PyPI.
#
# One-time setup: create the `reinfors` project's Trusted Publisher at
# https://pypi.org/manage/account/publishing/ (and its TestPyPI counterpart) — GitHub owner
# `jeepjeepjeep`, repo `reinfors`, workflow `release.yml`, environment `pypi` (`testpypi` on TestPyPI).
# No API token/secret is needed; publishing is via OIDC. In the repo, create GitHub environments
# `pypi` and `testpypi` (Settings > Environments; needs the repo public on the free plan) and give
# `pypi` a deployment tag policy of `v*` plus a required reviewer — publish jobs then pause for
# approval and can only mint the OIDC token from release tags.
#
# To cut a release: bump `[workspace.package] version` in Cargo.toml (the single version source; maturin
# reads it), merge, then publish a GitHub Release tagged `vX.Y.Z`. That fires this workflow, which builds
# release (--release) abi3 wheels + an sdist and uploads them. Manual `workflow_dispatch` builds the
# wheels and by default does NOT publish — use it to smoke the build. Dispatching with publish=testpypi
# additionally uploads to TestPyPI (needs the same Trusted Publisher registered at
# https://test.pypi.org/manage/account/publishing/) — the end-to-end dry run of the OIDC publish path.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "where to publish the built wheels"
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 } # intel
          - { os: macos-15, target: aarch64 } # apple silicon
          - { os: windows-latest, target: x64 }
    steps:
      # Actions are pinned to full commit SHAs (version in the trailing comment) rather than mutable
      # tags/branches: this workflow holds `id-token: write` (PyPI publish rights via OIDC), so a
      # compromised tag could otherwise abuse that token. Bump the SHA + comment together to upgrade.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10" # the abi3 floor (requires-python >=3.10); one wheel serves 3.10+
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # --release is essential: a debug build runs the Rust core ~10x slower (build_info()["profile"] must be "release").
          args: --release --out dist
          manylinux: auto # build inside a manylinux container on Linux for broad compatibility
          sccache: "true"
          # the mounted workspace fails git's dubious-ownership check inside the container,
          # which would strip git provenance from build_info on Linux wheels
          docker-options: -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=*
      # Install + import the freshly built wheel before it can reach PyPI (versions there are immutable —
      # a broken upload burns the version number). Runs on every native-arch runner; only the QEMU-cross
      # aarch64-linux wheel can't be executed by its host, so that row stays build-only (standard tradeoff).
      - name: smoke-import the built wheel
        if: matrix.os != 'ubuntu-latest' || matrix.target != 'aarch64'
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps --find-links dist reinfors
          python - <<'PYEOF'
          import numpy as np
          import reinfors as rf
          rf.Env(rf.games.Connect4()).reset()
          env = rf.Env(rf.games.CarRacing())  # v0.3's rapier/tiny-skia deps must load and render
          env.reset()
          assert np.asarray(env.observe(0)).shape == (3, 96, 96)
          PYEOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: install from the sdist
        run: |
          python -m pip install numpy dist/*.tar.gz
          python - <<'PYEOF'
          import numpy as np
          import reinfors as rf
          rf.Env(rf.games.Connect4()).reset()
          env = rf.Env(rf.games.CarRacing())  # v0.3's rapier/tiny-skia deps must load and render
          env.reset()
          assert np.asarray(env.observe(0)).shape == (3, 96, 96)
          PYEOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: publish
    if: github.event_name == 'release' || inputs.publish == 'testpypi'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: assert artifact versions match the release tag
        if: github.event_name == 'release'
        run: |
          want="${GITHUB_REF_NAME#v}"
          ls dist/*.whl dist/*.tar.gz >/dev/null
          for f in dist/*.whl; do
            v=$(basename "$f" | cut -d- -f2)
            [ "$v" = "$want" ] || { echo "$f is version $v, release tag wants $want"; exit 1; }
          done
          for f in dist/*.tar.gz; do
            v=$(basename "$f" .tar.gz); v=${v#reinfors-}
            [ "$v" = "$want" ] || { echo "$f is version $v, release tag wants $want"; exit 1; }
          done
      - name: publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      - name: publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
