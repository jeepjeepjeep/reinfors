site_name: reinfors
site_description: High-throughput reinforcement-learning search and sampling in Rust with caller-owned Python training
site_url: https://jeepjeepjeep.github.io/reinfors/
repo_url: https://github.com/jeepjeepjeep/reinfors
repo_name: jeepjeepjeep/reinfors
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works:
      - Architecture: how-it-works/architecture.md
      - Sampling and training: how-it-works/sampling-and-training.md
  - Guides:
      - Training loop: guides/training.md
      - Concurrent collection: guides/streaming.md
      - Telemetry and TensorBoard: guides/telemetry.md
      - Evaluation: guides/evaluation.md
      - Configuration and checkpoints: guides/configuration-and-checkpoints.md
  - Coverage:
      - Games: catalogue/games.md
      - Algorithms: catalogue/algorithms.md
      - Compatibility: catalogue/compatibility.md
  - Examples: examples/index.md
  - Extending reinfors:
      - Overview: extending/index.md
      - Rust components: extending/rust-components.md
      - Python bindings: extending/python-bindings.md
  - Benchmarks:
      - Status: benchmarks/index.md
      - Methodology: benchmarks/methodology.md
      - Reproducing: benchmarks/reproducing.md
  - Reference:
      - Overview: reference/index.md
      - Inference contract: reference/inference-contract.md
      - Batch formats: reference/batch-formats.md
      - Telemetry fields: reference/telemetry-fields.md
      - Python API: reference/python-api.md
      - Current boundaries: reference/limits.md
  - Development:
      - Setup: development/setup.md
      - Documentation: development/documentation.md
