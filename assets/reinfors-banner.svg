  <style>
    .edge{ fill:none; stroke:#8A97A8; stroke-width:2.6; opacity:.45; stroke-linecap:round; }
    .dot { fill:none; stroke:#8A97A8; stroke-width:2.8; stroke-opacity:.62; }
    .tittle-halo{ fill:none; stroke:url(#txtneon); stroke-width:4.5; filter:url(#softglow); }
    .tittle-core{ fill:none; stroke:url(#txtneon); stroke-width:4.5; }

    .hl  { fill:none; stroke:url(#neon); stroke-width:4.6; stroke-linecap:round;
           stroke-dasharray:100; stroke-dashoffset:100; filter:url(#glow); }
    .flash{ fill:none; stroke:#EDE9FE; stroke-width:9; stroke-linecap:round;
            stroke-linejoin:round; opacity:0; filter:url(#glow);
            animation:flash 14.0s linear infinite; }
    .hnode-halo{ fill:none; stroke:url(#neon); stroke-width:3.8; filter:url(#softglow); opacity:0; }
    .hnode-core{ fill:none; stroke:url(#neon); stroke-width:3.8; opacity:0; }
    .ping{ fill:none; stroke:url(#neon); stroke-width:2.4; opacity:0;
           transform-box:fill-box; transform-origin:center; }
    .bp  { fill:none; stroke:#F0ABFC; stroke-width:5.4; stroke-linecap:round;
           stroke-linejoin:round; stroke-dasharray:7 93; stroke-dashoffset:7;
           opacity:0; filter:url(#glow); animation:bpulse 14.0s linear infinite; }

    .tree{ animation:treepulse 3.5s linear infinite; }
    .bolt{ opacity:0; animation:life 14.0s linear infinite; }
    .e1{animation:d1 14.0s linear infinite} .e2{animation:d2 14.0s linear infinite}
    .e3{animation:d3 14.0s linear infinite} .e4{animation:d4 14.0s linear infinite}
    .np0{animation:np0 14.0s linear infinite} .np1{animation:np1 14.0s linear infinite}
    .np2{animation:np2 14.0s linear infinite} .np3{animation:np3 14.0s linear infinite}
    .np4{animation:np4 14.0s linear infinite}
    .pg0{animation:pg0 14.0s linear infinite} .pg1{animation:pg1 14.0s linear infinite}
    .pg2{animation:pg2 14.0s linear infinite} .pg3{animation:pg3 14.0s linear infinite}
    .pg4{animation:pg4 14.0s linear infinite}
    .g1,.g1 *{animation-delay:0s}   .g2,.g2 *{animation-delay:3.5s}
    .g3,.g3 *{animation-delay:7.0s}   .g4,.g4 *{animation-delay:10.5s}

    .wm{ font-family:&#39;Avenir Next&#39;,&#39;Futura&#39;,&#39;Century Gothic&#39;,&#39;Helvetica Neue&#39;,Arial,sans-serif; font-weight:500; }
    .wm-halo{ fill:none; stroke:url(#txtneon); stroke-width:4.6;
              stroke-linejoin:round; filter:url(#softglow); }
    .wm-core{ fill:none; stroke:url(#txtneon); stroke-width:4.6; stroke-linejoin:round;
             shape-rendering:geometricPrecision; }

    @keyframes life{ 0%{opacity:0} 0.09%{opacity:1} 16.43%{opacity:1} 21.79%{opacity:0} 100%{opacity:0} }
    @keyframes d1{ 0%{stroke-dashoffset:100} 0.7143%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes d2{ 0%,0.8571%{stroke-dashoffset:100} 1.571%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes d3{ 0%,1.714%{stroke-dashoffset:100} 2.429%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes d4{ 0%,2.571%{stroke-dashoffset:100} 3.286%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes np0{ 0%{opacity:1} 100%{opacity:1} }
    @keyframes np1{ 0%,0.7143%{opacity:0} 0.7857%{opacity:1} 100%{opacity:1} }
    @keyframes np2{ 0%,1.571%{opacity:0} 1.643%{opacity:1} 100%{opacity:1} }
    @keyframes np3{ 0%,2.429%{opacity:0} 2.5%{opacity:1} 100%{opacity:1} }
    @keyframes np4{ 0%,3.286%{opacity:0} 3.357%{opacity:1} 100%{opacity:1} }
    @keyframes pg0{ 0%{opacity:.9;transform:scale(.4)} 3.929%{opacity:0;transform:scale(3.2)} 100%{opacity:0;transform:scale(3.2)} }
    @keyframes pg1{ 0%,0.6429%{opacity:0;transform:scale(.4)} 0.7143%{opacity:.9;transform:scale(.4)} 4.643%{opacity:0;transform:scale(3.2)} 100%{opacity:0;transform:scale(3.2)} }
    @keyframes pg2{ 0%,1.5%{opacity:0;transform:scale(.4)} 1.571%{opacity:.9;transform:scale(.4)} 5.5%{opacity:0;transform:scale(3.2)} 100%{opacity:0;transform:scale(3.2)} }
    @keyframes pg3{ 0%,2.357%{opacity:0;transform:scale(.4)} 2.429%{opacity:.9;transform:scale(.4)} 6.357%{opacity:0;transform:scale(3.2)} 100%{opacity:0;transform:scale(3.2)} }
    @keyframes pg4{ 0%,3.214%{opacity:0;transform:scale(.4)} 3.286%{opacity:.9;transform:scale(.4)} 7.214%{opacity:0;transform:scale(3.2)} 100%{opacity:0;transform:scale(3.2)} }
    @keyframes flash{ 0%,2.143%{opacity:0} 3.286%{opacity:.9} 6.429%{opacity:0} 100%{opacity:0} }
    @keyframes bpulse{ 0%,7.714%{opacity:0;stroke-dashoffset:7} 7.857%{opacity:1;stroke-dashoffset:7} 13.21%{opacity:1;stroke-dashoffset:-93} 13.93%{opacity:0;stroke-dashoffset:-93} 100%{opacity:0;stroke-dashoffset:-93} }
    @keyframes treepulse{ 0%{opacity:0} 3.429%{opacity:1} 31.43%{opacity:1} 42.86%{opacity:0.82} 54.29%{opacity:0.55} 65.71%{opacity:0.25} 77.14%{opacity:0} 100%{opacity:0} }

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .tree{opacity:1} .bolt{opacity:.9} .hl{stroke-dashoffset:0}
      .hnode-halo,.hnode-core{opacity:1} .bp,.flash{opacity:0}
    }
  </style>

