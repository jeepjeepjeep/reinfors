  <title>reinfors</title>
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="399" y1="300" x2="959" y2="20">
      <stop offset="0" stop-color="#818CF8"/><stop offset="0.4" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#C084FC"/><stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <linearGradient id="txtneon" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="743" y2="0">
