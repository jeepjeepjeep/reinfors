<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1009 320" width="1009" height="320" role="img" aria-label="reinfors — reinforcement learning library">
  <title>reinfors</title>
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="399" y1="300" x2="959" y2="20">
      <stop offset="0" stop-color="#818CF8"/><stop offset="0.4" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#C084FC"/><stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <linearGradient id="txtneon" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="743" y2="0">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8C8C8C"/><stop offset="0.6" stop-color="#9E9E9E"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8C8C8C"/>
    </radialGradient>
    <mask id="clearing" maskUnits="userSpaceOnUse" x="0" y="0" width="1009" height="320">
      <rect width="1009" height="320" fill="#fff"/>
      <ellipse cx="504" cy="158" rx="256" ry="86" fill="url(#fade)"/>
      <circle cx="409" cy="128" r="30" fill="url(#spot)"/>
      <text class="wm" x="276.5" y="185" textLength="109.9" lengthAdjust="spacing" font-size="82" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round">RE</text>
      <text class="wm" x="409" y="185" text-anchor="middle" font-size="82" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round">&#305;</text>
      <text class="wm" x="431.5" y="185" textLength="301.1" lengthAdjust="spacing" font-size="82" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round">NFORS</text>
    </mask>
    <mask id="nofog-text" maskUnits="userSpaceOnUse" x="0" y="0" width="1009" height="320">
      <rect width="1009" height="320" fill="#fff"/>
      <text class="wm" x="276.5" y="185" textLength="109.9" lengthAdjust="spacing" font-size="82" fill="#000">RE</text>
      <text class="wm" x="409" y="185" text-anchor="middle" font-size="82" fill="#000">&#305;</text>
      <text class="wm" x="431.5" y="185" textLength="301.1" lengthAdjust="spacing" font-size="82" fill="#000">NFORS</text>
    </mask>
    <mask id="nofog-nodes" maskUnits="userSpaceOnUse" x="0" y="0" width="1009" height="320">
      <rect width="1009" height="320" fill="#fff"/>
      <circle cx="549" cy="58" r="8.2" fill="#000"/>
      <circle cx="549" cy="152" r="8.2" fill="#000"/>
      <circle cx="549" cy="246" r="8.2" fill="#000"/>
      <circle cx="674" cy="30" r="7.6" fill="#000"/>
      <circle cx="674" cy="116" r="7.6" fill="#000"/>
      <circle cx="674" cy="196" r="7.6" fill="#000"/>
      <circle cx="674" cy="274" r="7.6" fill="#000"/>
      <circle cx="799" cy="74" r="7.0" fill="#000"/>
      <circle cx="799" cy="152" r="7.0" fill="#000"/>
      <circle cx="799" cy="224" r="7.0" fill="#000"/>
      <circle cx="799" cy="296" r="7.0" fill="#000"/>
      <circle cx="934" cy="46" r="6.4" fill="#000"/>
      <circle cx="934" cy="130" r="6.4" fill="#000"/>
      <circle cx="934" cy="200" r="6.4" fill="#000"/>
      <circle cx="934" cy="276" r="6.4" fill="#000"/>
      <circle cx="409" cy="128" r="8.2" fill="#000"/>
