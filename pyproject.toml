[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "reinfors"
version = "0.0.0"
description = "General-purpose gym-style simulation + batching engine (Rust core, Python API)"
requires-python = ">=3.10"
dependencies = ["numpy"]

# Dev tooling isn't declared as project deps: the Python surface is light, so CI and local runs
# invoke pinned tools via `uvx <tool>@<version>` (no lockfile / project-management layer).

[tool.maturin]
python-source = "python"
module-name = "reinfors._reinfors"
manifest-path = "crates/reinfors-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
