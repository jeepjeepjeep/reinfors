[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "reinfors"
description = "General-purpose gym-style simulation + batching engine (Rust core, Python API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Roberts" }]
keywords = ["reinforcement-learning", "rust", "mcts", "self-play", "simulation", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]
# Version has one source — Cargo's `[workspace.package] version`; maturin reads it from there.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jeepjeepjeep/reinfors"
Issues = "https://github.com/jeepjeepjeep/reinfors/issues"

# torch is needed only to run the example trainer (`scripts/train_example.py`) and its smoke test; the
# reinfors package itself (core/search/engine) needs just numpy. Install with `pip install reinfors[train]`.
# `gym` pulls the standard-API adapters' backends (`reinfors.gym`), lazily imported so they're optional.
[project.optional-dependencies]
train = ["torch"]
gym = ["gymnasium", "pettingzoo"]
# `test` pulls everything the full test suite imports (both optional extras + pytest). It exists so a
# dev/editor venv is reproducible from the same source CI uses — `uv pip install -e ".[test]"` — rather
# than hand-populated (which drifts, leaving an editor's type checker unable to resolve test imports).
test = ["reinfors[train,gym]", "pytest"]

# Linters/build tools stay out of the project deps: CI and local runs invoke them pinned via
# `uvx <tool>@<version>` (ruff, mypy, maturin) — no lockfile / project-management layer. Only runtime +
# test imports live here, since those are what an editor's type checker must resolve.

[tool.maturin]
python-source = "python"
module-name = "reinfors._reinfors"
manifest-path = "crates/reinfors-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pyright (what VS Code / Pylance runs) reads this so IDE and CLI agree: resolve the project venv
# (a bare `uvx pyright` otherwise reports a silent 0/0/0 with imports unresolved) and pin basic mode
# — strict typing is mypy's job (below); pyright adds the analyses mypy lacks (e.g. possibly-unbound).
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.mypy]
# Type-check against 3.12 (the CI/dev interpreter — see `--interpreter python3.12` in the build): recent
# numpy stubs use PEP 695 `type` statements that mypy refuses to parse under an older target. Runtime
# still supports 3.10+ (`requires-python`), and ruff's py310 target guards against newer syntax slipping in.
python_version = "3.12"
strict = true
warn_unused_configs = true

# The type checker only covers the `python/` package, which is torch-free (numpy only). The torch-using
# code — `scripts/train_example.py` and `tests/test_example.py` — is exercised by the local torch tests,
# not mypy, so no torch override is needed here.

# The Gymnasium / PettingZoo adapters (`reinfors.gym`) subclass optional bases that aren't installed in
# the type-check env; treat them as untyped and allow subclassing them (same posture as torch).
[[tool.mypy.overrides]]
module = ["gymnasium.*", "pettingzoo.*", "jax.*", "pgx.*", "mctx.*", "pyspiel", "open_spiel.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reinfors.gym"]
disallow_subclassing_any = false

# The peer-benchmark harness imports optional, stubless frameworks (jax/pgx/mctx/pyspiel) and wraps
# their untyped surfaces; strict typing is not meaningful there. Same relaxed posture as reinfors.gym,
# so an IDE / full-tree mypy run stays signal, not noise.
[[tool.mypy.overrides]]
module = ["benchmark_vs"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false
