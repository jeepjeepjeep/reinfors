[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "reinfors"
version = "0.0.0"
description = "General-purpose gym-style simulation + batching engine (Rust core, Python API)"
requires-python = ">=3.10"
dependencies = ["numpy"]

# torch powers only the optional training layer (`reinfors.training`); the core/search/engine need
# just numpy. Install with `pip install reinfors[train]`.
[project.optional-dependencies]
train = ["torch"]

# Dev tooling isn't declared as project deps: the Python surface is light, so CI and local runs
# invoke pinned tools via `uvx <tool>@<version>` (no lockfile / project-management layer).

[tool.maturin]
python-source = "python"
module-name = "reinfors._reinfors"
manifest-path = "crates/reinfors-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

# torch is an optional dep not installed in the (uvx) type-check env, so it has no stubs here; treat
# its symbols as Any and allow subclassing nn.Module. The training layer is exercised by the local
# torch tests, not the type checker.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reinfors.training"
disallow_subclassing_any = false
disallow_any_decorated = false
warn_return_any = false
